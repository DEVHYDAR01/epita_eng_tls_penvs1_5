[project]
name = "epita_Aliyu_Hydar_Ahmad_space"
version = "0.1.0"
description = "TP2 Engineering Tools - NASA APOD CLI"
readme = "README.md"
authors = [
    { name = "Aliyu Hydar Ahmad" }
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
epita-aliyu-ahmad-cli = "epita_Aliyu_Hydar_Ahmad_space.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "epita_Aliyu_Hydar_Ahmad_space"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
